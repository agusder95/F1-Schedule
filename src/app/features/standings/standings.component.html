<div class="min-h-screen bg-gray-100 dark:bg-f1-carbon">
  <!-- Header -->
  <header class="sticky top-16 z-30 bg-gray-100 dark:bg-f1-carbon border-b border-gray-200 dark:border-gray-800">
    <div class="p-4">
      <h1 class="text-2xl font-bold text-f1-red tracking-wider">CAMPEONATO</h1>
      
      <!-- Season Selector -->
      <div class="flex gap-2 mt-4 overflow-x-auto">
        <button 
          *ngFor="let year of seasons"
          (click)="loadStandings(year)"
          class="px-4 py-2 rounded font-mono text-sm transition-all"
          [class.bg-f1-red]="selectedSeason() === year"
          [class.text-white]="selectedSeason() === year"
          [class.bg-gray-200]="selectedSeason() !== year"
          [class.dark:bg-gray-800]="selectedSeason() !== year"
          [class.text-gray-700]="selectedSeason() !== year"
          [class.dark:text-gray-300]="selectedSeason() !== year">
          {{ year }}
        </button>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="sticky top-28 z-20 bg-gray-100 dark:bg-f1-carbon border-b border-gray-200 dark:border-gray-800">
    <div class="flex">
      <button 
        (click)="setTab('drivers')"
        class="flex-1 py-3 text-sm font-mono text-center border-b-2"
        [class.border-f1-red]="activeTab() === 'drivers'"
        [class.text-f1-red]="activeTab() === 'drivers'"
        [class.border-transparent]="activeTab() !== 'drivers'"
        [class.text-gray-500]="activeTab() !== 'drivers'">
        Pilotos
      </button>
      <button 
        (click)="setTab('constructors')"
        class="flex-1 py-3 text-sm font-mono text-center border-b-2"
        [class.border-f1-red]="activeTab() === 'constructors'"
        [class.text-f1-red]="activeTab() === 'constructors'"
        [class.border-transparent]="activeTab() !== 'constructors'"
        [class.text-gray-500]="activeTab() !== 'constructors'">
        Constructores
      </button>
    </div>
  </nav>

  <!-- Loading -->
  <div *ngIf="loading()" class="flex items-center justify-center py-20">
    <div class="w-10 h-10 border-2 border-f1-red border-t-transparent rounded-full animate-spin"></div>
  </div>

  <!-- Standings List -->
  <main class="p-4" *ngIf="!loading()">
    <div class="space-y-2">
      <div *ngFor="let standing of currentStandings()" 
           class="flex items-center p-4 bg-f1-carbon rounded-lg"
           [class.ring-2]="standing.isTopThree"
           [class.ring-yellow-500]="standing.pos === 1 && standing.isTopThree"
           [class.ring-gray-400]="standing.pos === 2 && standing.isTopThree"
           [class.ring-yellow-700]="standing.pos === 3 && standing.isTopThree"
           [class.bg-yellow-900/20]="standing.pos === 1 && standing.isTopThree"
           [class.bg-gray-800/50]="standing.pos === 2 && standing.isTopThree"
           [class.bg-yellow-900/10]="standing.pos === 3 && standing.isTopThree">
        
        <!-- Position -->
        <div class="w-12">
          <span class="text-2xl font-bold"
                [class.text-yellow-500]="standing.pos === 1 && standing.isTopThree"
                [class.text-gray-400]="standing.pos === 2 && standing.isTopThree"
                [class.text-yellow-700]="standing.pos === 3 && standing.isTopThree"
                [class.text-gray-500]="!standing.isTopThree">
            {{ standing.pos }}
          </span>
        </div>
        
        <!-- Name -->
        <div class="flex-1 ml-4">
          <span class="text-lg text-white font-medium">{{ standing.entityName }}</span>
        </div>
        
        <!-- Points -->
        <div class="text-right">
          <span class="text-xl font-bold text-f1-red font-mono">{{ standing.points }}</span>
          <span class="text-xs text-gray-500 ml-1">pts</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Summary -->
  <footer class="fixed bottom-0 left-0 right-0 bg-f1-carbon border-t border-gray-800 p-4">
    <div class="flex justify-between items-center">
      <div>
        <span class="text-xs text-gray-500 font-mono">Líder</span>
        <p class="text-lg font-bold text-white">{{ currentStandings()[0]?.entityName || '-' }}</p>
      </div>
      <div class="text-right">
        <span class="text-xs text-gray-500 font-mono">Puntos Totales</span>
        <p class="text-xl font-bold text-f1-red font-mono">{{ totalPoints() }}</p>
      </div>
    </div>
  </footer>
</div>
