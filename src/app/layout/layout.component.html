<!-- Header -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 py-3 bg-f1-carbon border-b border-gray-800">
  <!-- Hamburger Menu -->
  <button (click)="toggleSidebar()" class="p-2 text-white hover:text-f1-red transition-colors">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Logo -->
  <h1 class="text-lg font-bold text-f1-red tracking-wider bg-red-600">SECTOR TRES</h1>

  <!-- Theme Toggle -->
  <button (click)="themeService.toggle()" class="p-2 text-white hover:text-f1-red transition-colors">
    <svg *ngIf="themeService.theme() === 'dark'" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke="currentColor" stroke-width="2" fill="none"/>
    </svg>
    <svg *ngIf="themeService.theme() === 'light'" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
      <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
    </svg>
  </button>
</header>

<!-- Sidebar Backdrop -->
<div *ngIf="sidebarOpen()"
     (click)="closeSidebar()"
     class="fixed inset-0 z-40 bg-black/50 md:hidden">
</div>

<!-- Sidebar -->
<aside [class.translate-x-0]="sidebarOpen()"
        [class.translate-x-full]="!sidebarOpen()"
        class="fixed top-0 right-0 z-50 h-full w-72 bg-f1-carbon border-l border-gray-800 transform transition-transform duration-300 md:translate-x-0">

  <!-- Close Button -->
  <div class="flex items-center justify-between p-4 border-b border-gray-800">
    <span class="text-sm text-gray-400 uppercase tracking-wider">Configuración</span>
    <button (click)="closeSidebar()" class="p-2 text-gray-400 hover:text-white transition-colors md:hidden">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Sidebar Content -->
  <nav class="p-4 space-y-4">
    <!-- Navigation Links -->
    <div>
      <label class="block text-sm text-gray-400 mb-2">Navegación</label>
      <div class="space-y-1">
        <a routerLink="/" (click)="closeSidebar()" class="block py-2 px-3 rounded text-white hover:bg-gray-800 transition-colors">
          Home
        </a>
        <a routerLink="/standings" (click)="closeSidebar()" class="block py-2 px-3 rounded text-white hover:bg-gray-800 transition-colors">
          Campeonato
        </a>
        <a routerLink="/favorites" (click)="closeSidebar()" class="block py-2 px-3 rounded text-white hover:bg-gray-800 transition-colors">
          Favoritos
        </a>
      </div>
    </div>

    <!-- Theme Selector -->
    <div>
      <label class="block text-sm text-gray-400 mb-2">Tema</label>
      <div class="flex gap-2">
        <button (click)="themeService.theme.set('light')"
                [ngClass]="themeService.theme() === 'light' ? 'bg-f1-red text-white' : 'bg-gray-800 text-white' "
                class="flex-1 py-2 px-4 rounded text-sm font-medium transition-colors">
          Light
        </button>
        <button (click)="themeService.theme.set('dark')"
                [ngClass]="themeService.theme() === 'dark' ? 'bg-f1-red text-white' : 'bg-gray-800 text-white' "
                class="flex-1 py-2 px-4 rounded text-sm font-medium transition-colors">
          Dark
        </button>
      </div>
    </div>

    <!-- Timezone Selector -->
    <div>
      <label class="block text-sm text-gray-400 mb-2">Zona Horaria</label>
      <select
        [value]="timeService.timezone()"
        (change)="onTimezoneChange($event)"
        class="w-full py-2 px-3 bg-gray-800 border border-gray-700 rounded text-white text-sm">
        <option *ngFor="let tz of timeService.timezoneOptions" [value]="tz.value">
          {{ tz.label }}
        </option>
      </select>
    </div>

    <!-- Danger Zone -->
    <div class="pt-4 border-t border-gray-800">
      <button (click)="clearAllData()" class="w-full py-2 px-4 border border-red-600 text-red-500 rounded text-sm hover:bg-red-600 hover:text-white transition-colors">
        Borrar todos los datos
      </button>
    </div>
  </nav>
</aside>

<!-- Main Content -->
<main class="pt-16 min-h-screen bg-gray-100 dark:bg-f1-carbon">
  <router-outlet></router-outlet>
</main>
